<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>南梁的美照</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{
width:100vw;height:100vh;overflow:hidden;
background-image:url("bg1.jpg");
background-repeat:no-repeat;background-position:center;background-size:cover;
transition:background-image 0.6s ease;
position:relative;
}
.card{
width:90%;max-width:400px;
background:rgba(0,0,0,0.4);backdrop-filter:blur(10px);
border-radius:20px;padding:40px 25px;text-align:center;
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
border:1px solid rgba(255,255,255,0.15);
z-index:9999;
}
.title{
color:#fff;font-size:clamp(22px,6vw,28px);margin-bottom:35px;
text-shadow:0 2px 8px rgba(0,0,0,0.4);line-height:1.3;
}
.link-btn{
display:inline-block;padding:14px 40px;
background:linear-gradient(135deg,#7b68ee,#a855f7);
color:#fff;text-decoration:none;border-radius:50px;font-size:17px;
box-shadow:0 4px 15px rgba(123,104,238,0.4);transition:all 0.3s ease;
margin-bottom:10px;
}
.link-btn:active{transform:scale(0.97);box-shadow:0 2px 10px rgba(123,104,238,0.3);}
.bg-group{margin-top:35px;display:flex;justify-content:center;gap:15px;}
.music-group{margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:center;}
.bg-group button,.music-group button{
padding:10px 22px;border:none;border-radius:25px;
background:rgba(255,255,255,0.3);color:#fff;cursor:pointer;font-size:15px;
transition:background 0.3s ease;
width:180px;
}
.bg-group button:hover,.music-group button:hover{background:rgba(255,255,255,0.45);}

/* 视频容器样式 */
.video-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
}
.video-container.active {
    display: flex;
}
#mysteryVideo {
    max-width: 90%;
    max-height: 80vh;
    border: 2px solid #fff;
}
.close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.3);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.3s ease;
}
.close-btn:hover {
    background: rgba(255,255,255,0.5);
}
</style>
</head>
<body>
<div class="card">
<h2 class="title">点击查看南梁的美照</h2>
<a href="https://ys.mihoyo.com/?utm_source=yuanshen_web" class="link-btn">点击进入</a>
<div class="bg-group">
<button onclick="changeBg1()">背景1</button>
<button onclick="changeBg2()">背景2</button>
</div>
<div class="music-group">
<button id="musicBtn" onclick="playOnceAudio()">神秘音效</button>
<button onclick="openMysteryVideo()">神秘视频</button>
</div>
</div>

<!-- 视频容器 -->
<div class="video-container" id="videoContainer">
    <video id="mysteryVideo" controls>
        <source src="mystery_video.mp4" type="video/mp4">
        您的浏览器不支持视频播放
    </video>
    <button class="close-btn" onclick="closeVideo()">×</button>
</div>

<!-- 三个独立音频 -->
<audio id="audioMain" src="music.mp3">
<audio id="audio2" src="audio2.mp3">
<audio id="audio3" src="audio3.mp3">

<script>
// 主音效：神秘音效按钮
const audioMain = document.getElementById('audioMain');
const btn = document.getElementById('musicBtn');
let isPlaying = false;

audioMain.addEventListener('ended', () => {
    audioMain.pause();
    audioMain.currentTime = 0;
    btn.innerText = '神秘音效';
    isPlaying = false;
});
function playOnceAudio() {
    if(isPlaying) return;
    // 尝试播放音频，处理浏览器自动播放限制
    audioMain.play().catch(err => {
        console.log('播放失败，可能需要用户交互后才能播放:', err);
        btn.innerText = '请先点击页面再试';
        setTimeout(() => {
            btn.innerText = '神秘音效';
        }, 2000);
    }).then(() => {
        if(!isPlaying) {
            btn.innerText = '播放中...';
            isPlaying = true;
        }
    });
}

// 神秘视频相关
const videoContainer = document.getElementById('videoContainer');
const mysteryVideo = document.getElementById('mysteryVideo');

function openMysteryVideo() {
    videoContainer.classList.add('active');
    mysteryVideo.play().catch(err => {
        console.log('视频播放失败:', err);
    });
}

function closeVideo() {
    videoContainer.classList.remove('active');
    mysteryVideo.pause();
    mysteryVideo.currentTime = 0;
}

// 点击视频容器外部关闭视频
videoContainer.addEventListener('click', (e) => {
    if (e.target === videoContainer) {
        closeVideo();
    }
});

// 背景1：切换背景 + 播放音频2
function changeBg1() {
    document.body.style.backgroundImage='url(bg1.jpg)';
    audio2.currentTime = 0;
    audio2.play().catch(err => console.log('音频2播放失败:', err));
}
// 背景2：切换背景 + 播放音频3
function changeBg2() {
    document.body.style.backgroundImage='url(bg2.jpg)';
    audio3.currentTime = 0;
    audio3.play().catch(err => console.log('音频3播放失败:', err));
}
</script>
</body>
</html>
