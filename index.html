<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>南梁的美照</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{
width:100vw;height:100vh;overflow:hidden;
background-image:url("bg1.jpg");
background-repeat:no-repeat;background-position:center;background-size:cover;
transition:background-image 0.6s ease;
position:relative;
}
.card{
width:90%;max-width:400px;
background:rgba(0,0,0,0.4);backdrop-filter:blur(10px);
border-radius:20px;padding:40px 25px;text-align:center;
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
border:1px solid rgba(255,255,255,0.15);
z-index:9999 !important;
}
.title{
color:#fff;font-size:clamp(22px,6vw,28px);margin-bottom:35px;
text-shadow:0 2px 8px rgba(0,0,0,0.4);line-height:1.3;
}
.link-btn{
display:inline-block;padding:14px 40px;
background:linear-gradient(135deg,#7b68ee,#a855f7);
color:#fff;text-decoration:none;border-radius:50px;font-size:17px;
box-shadow:0 4px 15px rgba(123,104,238,0.4);transition:all 0.3s ease;
}
.link-btn:active{transform:scale(0.97);box-shadow:0 2px 10px rgba(123,104,238,0.3);}
.bg-group{margin-top:35px;display:flex;justify-content:center;gap:15px;}
.music-group{margin-top:20px;}
.bg-group button,.music-group button{
padding:10px 22px;border:none;border-radius:25px;
background:rgba(255,255,255,0.3);color:#fff;cursor:pointer;font-size:15px;
transition:background 0.3s ease;
}
.bg-group button:hover,.music-group button:hover{background:rgba(255,255,255,0.45);}
</style>
</head>
<body>
<div class="card">
<h2 class="title">点击查看南梁的美照</h2>
<a href="https://ys.mihoyo.com/?utm_source=yuanshen_web" class="link-btn">点击进入</a>
<div class="bg-group">
<button onclick="document.body.style.backgroundImage='url(bg1.jpg)'">背景1</button>
<button onclick="document.body.style.backgroundImage='url(bg2.jpg)'">背景2</button>
</div>
<div class="music-group">
<button id="musicBtn" onclick="playOnceAudio()">神秘音效</button>
</div>
</div>

<audio id="bgMusic" src="music.mp3">
<script>
const audio = document.getElementById('bgMusic');
const btn = document.getElementById('musicBtn');
let isPlaying = false;

// 播放结束自动重置状态
audio.addEventListener('ended', () => {
    audio.pause();
    audio.currentTime = 0;
    btn.innerText = '神秘音效';
    isPlaying = false;
});

// 仅播放一次，禁止重复点击
function playOnceAudio() {
    if(isPlaying) return;
    audio.play();
    btn.innerText = '播放中...';
    isPlaying = true;
}
</script>
</body>
</html>
