<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推的美照</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            /* 直接写死初始背景，避免加载失败 */
            background-image: url("bg1.jpg");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            transition: background-image 0.6s ease;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .title {
            color: #fff;
            font-size: 26px;
            margin-bottom: 35px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .link-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #7b68ee, #a855f7);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        .bg-group {
            margin-top: 30px;
        }

        .bg-group button {
            padding: 8px 18px;
            margin: 0 8px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.3);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="title">点击查看推的美照</h2>
        <a href="https://ys.mihoyo.com/main/m/news/detail/13367" class="link-btn">点击进入</a>

        <!-- 背景切换按钮，确保完整显示 -->
        <div class="bg-group">
            <button onclick="document.body.style.backgroundImage='url(bg1.jpg)'">背景1</button>
            <button onclick="document.body.style.backgroundImage='url(bg2.jpg)'">背景2</button>
        </div>
    </div>

</body>
</html>
